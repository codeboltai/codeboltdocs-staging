name: Deploy documentation staging

on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the documentation branch
        uses: actions/checkout@v4
        with:
          repository: codeboltai/codeboltdocs
          ref: restructure
          persist-credentials: false

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the staging site
        run: npm exec -- docusaurus build --no-minify
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          DOCUSAURUS_PERF_LOGGER: 'true'
          CODEBOLT_DOCS_SITE_URL: ${{ steps.pages.outputs.origin }}
          CODEBOLT_DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to staging
        id: deployment
        uses: actions/deploy-pages@v4
